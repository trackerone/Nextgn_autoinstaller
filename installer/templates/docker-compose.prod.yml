version: '3.9'

services:
  app:
    image: nextgn-tracker:local
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - app-storage:/app/storage
    healthcheck:
      test: ['CMD', 'php', '-v']
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    image: nextgn-tracker:local
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - app-storage:/app/storage
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy

  scheduler:
    image: nextgn-tracker:local
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - app-storage:/app/storage
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      app:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_started

  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: '${DB_DATABASE:?DB_DATABASE must be set}'
      MYSQL_USER: '${DB_USERNAME:?DB_USERNAME must be set}'
      MYSQL_PASSWORD: '${DB_PASSWORD:?DB_PASSWORD must be set}'
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_root_password
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  app-storage:
  database-data:
  redis-data:
  caddy-data:
  caddy-config:

secrets:
  mysql_root_password:
    file: ../.env.mysql-root
